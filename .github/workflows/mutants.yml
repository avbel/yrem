name: Mutants

on:
  schedule:
    - cron: "23 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

env:
  CARGO_TERM_COLOR: always

jobs:
  mutants:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v7
      - name: Install toolchain from rust-toolchain.toml
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-mutants@27.1.0
      - name: Run cargo-mutants
        run: >
          cargo mutants --in-place --no-shuffle
          -f 'src/ops/**' -f src/error.rs -f 'src/mcp/**' -f src/time.rs -f 'src/secrets/**'
        continue-on-error: true
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: mutants-out
          path: mutants.out
          if-no-files-found: warn
      - name: Open an issue per surviving mutant
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [ -s mutants.out/missed.txt ] || exit 0
          while IFS= read -r mutant; do
            title="Surviving mutant: $mutant"
            existing=$(gh issue list --state open --search "Surviving mutant in:title" --limit 500 --json title | jq -r --arg t "$title" '.[] | select(.title == $t) | .title')
            if [ -z "$existing" ]; then
              gh issue create --title "$title" \
                --body "Weekly cargo-mutants run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}. Add a test that fails with this mutation applied."
            fi
          done < mutants.out/missed.txt
