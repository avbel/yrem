name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Cargo `build.warnings = "deny"` (stable since 1.97); not RUSTFLAGS=-Dwarnings.
  CARGO_BUILD_WARNINGS: deny

jobs:
  fmt:
    name: fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install toolchain from rust-toolchain.toml
        run: rustup show active-toolchain || rustup toolchain install
      - run: cargo fmt --check

  windows:
    name: ${{ matrix.os }} build
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, windows-11-arm]
    env:
      # aws-lc-sys: use its prebuilt NASM objects instead of requiring NASM (x86_64).
      AWS_LC_SYS_PREBUILT_NASM: 1
    steps:
      - uses: actions/checkout@v5
      # windows-11-arm images may lack rustup; this provides it, the pin comes from rust-toolchain.toml.
      - uses: dtolnay/rust-toolchain@stable
      - name: Install toolchain from rust-toolchain.toml
        run: rustup toolchain install
      - name: Ensure clang-cl (aws-lc on arm64)
        if: runner.arch == 'ARM64'
        shell: pwsh
        run: |
          if (-not (Get-Command clang-cl -ErrorAction SilentlyContinue)) { winget install --id LLVM.LLVM -e --silent --accept-source-agreements --accept-package-agreements; "C:\Program Files\LLVM\bin" | Out-File -Append $env:GITHUB_PATH }
      - uses: Swatinem/rust-cache@v2
      - name: Clippy
        run: cargo clippy --locked -- -D warnings
      - name: Build
        run: cargo build --locked

  test:
    name: ${{ matrix.os }} ${{ matrix.features || 'default' }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        features: ["", "--no-default-features"]
    steps:
      - uses: actions/checkout@v5
      - name: Install toolchain from rust-toolchain.toml
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.features }}
      - name: Clippy
        run: cargo clippy --all-targets --locked ${{ matrix.features }} -- -D warnings
      - name: Test
        run: cargo test --locked ${{ matrix.features }}

  coverage:
    name: coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install toolchain from rust-toolchain.toml
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov@0.9.1
      - name: Coverage gate
        run: >
          cargo llvm-cov --all-features --locked
          --fail-under-lines 98 --fail-under-regions 96
          --lcov --output-path lcov.info
      - name: Per-file summary
        if: ${{ !cancelled() }}
        run: |
          {
            echo '## Coverage'
            echo '```'
            cargo llvm-cov report --summary-only
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: lcov
          path: lcov.info
          if-no-files-found: warn

  deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny@0.20.2
      - run: cargo deny check
